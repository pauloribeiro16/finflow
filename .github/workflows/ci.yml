name: Finflow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testProdDebugUnitTest :app:testDemoDebugUnitTest

      - name: Domain coverage gate
        run: |
          ./gradlew :app:createProdDebugUnitTestCoverageReport
          python3 .github/scripts/check_domain_coverage.py

      - name: Lint
        run: ./gradlew :app:lintProdDebug

      - name: Build Debug APKs and instrumented tests
        run: ./gradlew :app:assembleProdDebug :app:assembleDemoDebug :app:assembleProdDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            app/build/reports/lint-results-prodDebug.html
            app/build/reports/coverage/test/prod/debug/
            app/build/reports/tests/
          retention-days: 14
