name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.2.0)'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine Tag Name
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag name: must match vX.Y.Z"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Release Keystore (GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > finflow-release.keystore
            printf "storeFile=finflow-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Production keystore configured from GitHub Secrets."
          else
            echo "::error::Missing signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Refusing to publish a release signed with a throwaway key: users could not update from one release to the next."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testProdDebugUnitTest

      - name: Build Release Bundle and APK
        run: ./gradlew :app:bundleProdRelease :app:assembleProdRelease :app:assembleDemoRelease

      - name: Remove signing material from disk
        if: always()
        run: |
          rm -f finflow-release.keystore keystore.properties
          ./gradlew --stop || true

      - name: Prepare Release Artifacts
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk -path "*prod/release*" -name "*.apk" | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle -name "*prod*release*.aab" -o -name "*release*.aab" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "❌ Erro: APK de Release não encontrado."
            exit 1
          fi
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "❌ Erro: AAB de Release não encontrado."
            exit 1
          fi
          DEMO_APK=$(find app/build/outputs/apk -path "*demo/release*" -name "*.apk" | head -n 1)
          if [ -z "$DEMO_APK" ] || [ ! -f "$DEMO_APK" ]; then
            echo "❌ Erro: APK Demo de Release não encontrado."
            exit 1
          fi
          cp "$DEMO_APK" "dist/Finflow-Demo-${TAG}.apk"
          cp "$APK_FILE" "dist/Finflow-${TAG}.apk"
          cp "$AAB_FILE" "dist/Finflow-${TAG}.aab"
          cd dist
          shasum -a 256 "Finflow-${TAG}.apk" "Finflow-Demo-${TAG}.apk" "Finflow-${TAG}.aab" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify release signing certificate
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          EXPECTED="8104259d37aedb3557a0255e6518c0430a3fea535151789a5671ce709a9792a5"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for f in "dist/Finflow-${TAG}.apk" "dist/Finflow-Demo-${TAG}.apk"; do
            ACTUAL=$("$APKSIGNER" verify --print-certs "$f" | grep -i 'certificate SHA-256 digest' | head -n 1 | awk '{print $NF}')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$f is signed with an unexpected certificate ($ACTUAL)"
              exit 1
            fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/Finflow-${TAG}.apk" \
            "dist/Finflow-Demo-${TAG}.apk" \
            "dist/Finflow-${TAG}.aab" \
            "dist/SHA256SUMS.txt" \
            --title "Finflow ${TAG}" \
            --generate-notes
